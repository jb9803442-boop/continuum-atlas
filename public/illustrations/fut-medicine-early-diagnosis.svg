<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="title desc"><title id="title">Early diagnosis</title><desc id="desc">A magnifying lens finds a signal while a timeline reminds us that earlier detection is not automatically beneficial.</desc><defs><radialGradient id="mint" cx="35%" cy="30%" r="85%"><stop stop-color="#91bca4" stop-opacity=".75"/><stop offset=".5" stop-color="#335d4f" stop-opacity=".8"/><stop offset="1" stop-color="#142b28"/></radialGradient><radialGradient id="copper" cx="30%" cy="25%" r="90%"><stop stop-color="#d0ad94"/><stop offset=".55" stop-color="#7e6257"/><stop offset="1" stop-color="#332f30"/></radialGradient><linearGradient id="blue"><stop stop-color="#9abdc9"/><stop offset="1" stop-color="#294852"/></linearGradient><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#afe3cb"/></marker></defs><g fill="none" stroke="#7ca594" opacity=".14"><circle cx="120" cy="100" r="83"/><circle cx="120" cy="100" r="68" stroke-dasharray="2 5"/><path d="M20 100H220M120 8V192" stroke-dasharray="2 6"/></g><circle cx="106" cy="84" r="44" fill="none" stroke="#b4c7ed" stroke-width="1.2" /><path d="M137 119L177 162" fill="none" stroke="#b4c7ed" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="105" cy="84" r="17" fill="url(#mint)" stroke="#afe3cb" stroke-width="1.2" /><path d="M98 84h14M105 77v14" fill="none" stroke="#afe3cb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M46 174H196" fill="none" stroke="#719a88" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="75" cy="174" r="4" fill="url(#mint)" stroke="#afe3cb" stroke-width="1.2" /><text x="120" y="193" fill="#719a88" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" letter-spacing="1">DETECTION ≠ BETTER OUTCOME</text></svg>